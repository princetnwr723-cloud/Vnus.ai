name: Build Android APK (EAS Cloud)

# Runs entirely on GitHub's + Expo's cloud servers.
# You never need Android Studio, a local SDK, or even a PC —
# push to GitHub (even from the GitHub mobile app on iPad) and this fires.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger it manually from the GitHub app too

jobs:
  build:
    name: Trigger EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      # Diagnostic step — runs the exact command that's failing inside
      # `eas build`, directly, so its full error output prints in this
      # log instead of being summarized/swallowed by the eas-cli wrapper.
      - name: Debug - show full expo config error
        run: npx expo config --json
        continue-on-error: true

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      # This kicks off the build on Expo's servers and exits — the actual
      # build (10-20 min) happens on EAS infrastructure, not this runner.
      # Track progress and download the APK from https://expo.dev